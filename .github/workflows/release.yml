name: Compile Typst PDF

on:
  push:
    branches: [main]
    paths:
      - "**.typ"
      - "assets/**"
      - "summary/**"
      - "map/ICCBD-concept-map.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Typst
        uses: typst-community/setup-typst@v4

      - name: Install fonts
        run: |
          sudo apt-get install -y fonts-jetbrains-mono

          git clone --depth=1 https://gitlab.com/bonjour-monde/fonderie/syne-typeface.git /tmp/syne
          mkdir -p ~/.local/share/fonts
          cp /tmp/syne/fonts/ttf/*.ttf ~/.local/share/fonts/

      - name: Compile
        run: |
          typst compile main.typ ICCBD-notes.pdf
          typst compile --root . summary/summary.typ ICCBD-summary.pdf

      - name: Publish PDFs to the rolling "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest compiled PDFs
          body: >-
            Auto-compiled from the latest commit on `main`.
            Download `ICCBD-notes.pdf` (full notes), `ICCBD-summary.pdf` (compact summary),
            or `ICCBD-concept-map.svg` (concept map) below.
          files: |
            ICCBD-notes.pdf
            ICCBD-summary.pdf
            map/ICCBD-concept-map.svg
